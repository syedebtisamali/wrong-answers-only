<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Foreman Pythons | Wrong Answers Only</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; width:100%;
    font-family:'Segoe UI', system-ui, Roboto, Arial, sans-serif;
    background:#0d1117; color:#f5f7fa;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden;
  }
  .club-name{ font-size:14px; letter-spacing:3px; color:#f4d13d; font-weight:700; text-transform:uppercase; margin-bottom:2px;}
  .logo-snake{ font-size:56px; margin-bottom:8px; }
  h1{
    font-size:clamp(26px,6vw,42px); margin:0 0 40px 0; font-weight:800;
    background:linear-gradient(90deg,#f4d13d,#fff5,#3776ab);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .row{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }
  a.btn{
    text-decoration:none; display:inline-block;
    border:none; cursor:pointer; font-weight:700; letter-spacing:.5px;
    border-radius:50px; padding:18px 42px; font-size:19px;
    color:#111;
  }
  .btn-students{ background:linear-gradient(90deg,#f4d13d,#ffffffcc); box-shadow:0 8px 24px #f4d13d55; }
  .btn-teachers{ background:linear-gradient(90deg,#3776ab,#ffffffcc); box-shadow:0 8px 24px #3776ab55; color:#111; }
  a.btn:active{ transform:scale(.95); }
</style>
</head>
<body>
  <div class="club-name">Foreman Pythons · CS Club</div>
  <div class="logo-snake">🐍</div>
  <h1>WRONG ANSWERS ONLY</h1>
  <div class="row">
    <a class="btn btn-students" href="students.html">🎒 Students</a>
    <a class="btn btn-teachers" href="teachers.html">🍎 Teachers</a>
  </div>
</body>
</html>
